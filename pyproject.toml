[project]
name = "lang-view"
version = "0.1.0"
description = "Watch the screen and log Korean/Japanese text via OCR."
requires-python = ">=3.10"
dependencies = [
    "easyocr>=1.7.0",
    "mss>=9.0.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
kana = ["pykakasi>=2.2"]
romaja = ["hangul-romanize>=0.1.0"]
mangaocr = ["manga-ocr>=0.1.10"]
deepl = ["deepl>=1.16"]
openai = ["openai>=1.0"]
argos = ["argostranslate>=1.9"]
snippets = ["pillow>=10.0"]
encrypt = ["cryptography>=42.0"]
macos = ["pyobjc-framework-Cocoa>=10.0", "pyobjc-framework-Quartz>=10.0"]

[project.scripts]
lang-view = "lang_view.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lang_view", "lang_view.enrich"]
